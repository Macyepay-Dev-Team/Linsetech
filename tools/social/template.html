<!doctype html>
<!--
  Linse social post templates (brand identity, /brand → Social layout system). Not part of the site build.
  render.cjs opens this file with ?spec=<url-encoded JSON> and screenshots #post at its native size.
  Spec: { kind: "cover" | "slide", tone: "night" | "light", w, h, label, counter, headline, keyword, body, cards: [{icon,title,text}],
          hero: "<image url>", cta, url, lang }
-->
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Narrow:wght@500;600&display=block" rel="stylesheet" />
<style>
  :root { --night:#020a07; --green:#22c55e; --green600:#15803d; --off:#f3f3f3; --ink:#0b1411; --mist:#fbfdf9; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #444; }
  #post { position: relative; overflow: hidden; font-family: Archivo, sans-serif; font-weight: 500; -webkit-font-smoothing: antialiased; }
  .night { background: radial-gradient(ellipse 95% 55% at 70% 108%, rgba(34,197,94,.42), rgba(34,197,94,0) 70%), var(--night); color: var(--off); }
  .light { background: radial-gradient(ellipse 120% 70% at 50% -20%, #cdefd9 30%, rgba(251,253,249,0) 75%), var(--mist); color: var(--ink); }
  .grain::after { content:""; position:absolute; inset:0; pointer-events:none; opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .frame { position:absolute; inset:64px; display:flex; flex-direction:column; }
  .top { display:flex; justify-content:space-between; align-items:center; height:44px; }
  .logo { display:flex; align-items:center; gap:14px; font-weight:600; font-size:30px; letter-spacing:-.03em; }
  .logo svg { height:38px; width:auto; fill: currentColor; }
  .label { font-family:"Archivo Narrow", sans-serif; text-transform:uppercase; letter-spacing:.08em; font-size:20px; display:flex; gap:18px; align-items:center; }
  .label .pin { width:10px; height:10px; background:var(--green); display:inline-block; }
  .lang { border:1.5px solid currentColor; padding:4px 8px 3px; font-size:16px; opacity:.7; }
  h1 { font-weight:500; letter-spacing:-.025em; line-height:1.0; }
  .night .kw { color: var(--green); }
  .light .kw { background: var(--green); color: var(--ink); padding: 0 .12em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .body { font-size:30px; line-height:1.35; max-width:760px; opacity:.82; }
  .foot { margin-top:auto; position:relative; padding-top:26px; display:flex; justify-content:space-between; align-items:center; }
  .foot::before { content:""; position:absolute; top:0; left:0; right:0; border-top:2px dashed currentColor; opacity:.22; }
  .url { font-family:"Archivo Narrow", sans-serif; text-transform:uppercase; letter-spacing:.08em; font-size:20px; opacity:.75; }
  .cta { font-family:"Archivo Narrow", sans-serif; text-transform:uppercase; letter-spacing:.08em; font-size:20px; padding:16px 22px; background:var(--green); color:var(--ink); display:flex; gap:14px; align-items:center; }
  .cta i { font-style:normal; font-size:22px; }
  .hero { position:absolute; pointer-events:none; }
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .card { position:relative; padding:28px; min-height:220px; display:flex; flex-direction:column; gap:14px;
    background:linear-gradient(160deg, rgba(255,255,255,.55), rgba(255,255,255,.18)); border:1.5px solid rgba(11,20,17,.12);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.9), 0 30px 60px -30px rgba(6,40,31,.35); backdrop-filter: blur(14px); }
  .night .card { background:linear-gradient(160deg, rgba(243,243,243,.10), rgba(243,243,243,.03)); border-color:rgba(243,243,243,.16); box-shadow: inset 0 1.5px 0 rgba(243,243,243,.18); }
  .card .ic { width:44px; height:44px; border:2px solid var(--green); display:grid; place-items:center; font-family:"Archivo Narrow"; font-size:18px; color:var(--green600); }
  .night .card .ic { color: var(--green); }
  .card b { font-weight:600; font-size:30px; letter-spacing:-.01em; }
  .card span { font-size:22px; line-height:1.35; opacity:.75; }
  .idx { font-family:"Archivo Narrow"; font-size:18px; letter-spacing:.08em; opacity:.6; }
</style>
</head>
<body>
<div id="post"></div>
<script>
const LS = '<svg viewBox="0 0 640 552"><path d="M320 0 L365.5 78.9 L140.8 468 L288.8 468 L241.5 550 L2.4 550 Z"/><path d="M393.3 127.8 L439.4 207.7 L363.9 338 L515.2 338 L637.6 550 L299.5 550 L346.8 468 L498.2 468 L470.5 420 L224.5 420 Z"/></svg>';
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const spec = JSON.parse(decodeURIComponent(new URLSearchParams(location.search).get("spec") || "{}"));
const { kind = "cover", tone = "night", w = 1080, h = 1350, label = "", counter = "", headline = "", keyword = "", body = "", cards = [], hero, heroBox, cta, url = "linsetech.com", lang } = spec;
const post = document.getElementById("post");
post.className = `${tone} grain`;
post.style.width = w + "px"; post.style.height = h + "px";
const hl = keyword && headline.includes(keyword) ? esc(headline).replace(esc(keyword), `<span class="kw">${esc(keyword)}</span>`) : esc(headline);
const size = spec.size || (kind === "cover" ? 104 : 76);
const heroImg = hero ? `<img class="hero" src="${hero}" style="${heroBox || "right:-90px;bottom:120px;width:820px"}" />` : "";
const cardHtml = cards.length ? `<div class="cards" style="margin-top:56px">${cards.map((c, i) => `<div class="card"><div class="ic">${esc(c.icon || String(i + 1).padStart(2, "0"))}</div><b>${esc(c.title)}</b><span>${esc(c.text)}</span></div>`).join("")}</div>` : "";
post.innerHTML = `${heroImg}<div class="frame">
  <div class="top"><div class="logo">${LS}<span>Linse</span></div>
    <div class="label"><span class="pin"></span><span>${esc(label)}</span>${lang ? `<span class="lang">${esc(lang)}</span>` : ""}${counter ? `<span class="idx">${esc(counter)}</span>` : ""}</div></div>
  <h1 style="font-size:${size}px;margin-top:${kind === "cover" ? 120 : 96}px;max-width:${kind === "cover" ? 800 : 940}px">${hl}</h1>
  ${body ? `<p class="body" style="margin-top:36px">${esc(body)}</p>` : ""}
  ${cardHtml}
  <div class="foot"><span class="url">${esc(url)}</span>${cta ? `<span class="cta">${esc(cta)}<i>→</i></span>` : ""}</div>
</div>`;
document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
</html>
