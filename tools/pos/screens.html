<!doctype html>
<!-- The Linse POS terminal's two screens (illustrative data), rendered to PNG and used as emission textures by
     tools/blender/pos.py. ?screen=operator (1920x1080) | customer (1280x800). -->
<html><head><meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Narrow:wght@500;600&display=block" rel="stylesheet" />
<style>
:root{--night:#020a07;--n2:#06140f;--n3:#0b1f18;--green:#22c55e;--off:#f3f3f3;--sub:rgba(243,243,243,.6);--line:rgba(243,243,243,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--night);color:var(--off);font-family:Archivo,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}
.nar{font-family:"Archivo Narrow";text-transform:uppercase;letter-spacing:.08em}
.ls{fill:currentColor}
#op{width:1920px;height:1080px;display:grid;grid-template-columns:1fr 660px;grid-template-rows:96px 1fr;background:radial-gradient(ellipse 60% 50% at 85% 110%,rgba(34,197,94,.22),transparent 70%),var(--night)}
.bar{grid-column:1/3;display:flex;align-items:center;gap:22px;padding:0 44px;border-bottom:2px solid var(--line)}
.bar svg{height:38px}.bar b{font-size:30px;font-weight:600;letter-spacing:-.02em}
.chip{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:20px}
.chip span{border:2px solid var(--line);padding:8px 14px}
.chip .ok{border-color:var(--green);color:var(--green)}
.items{padding:36px 44px;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:80px 1fr 140px 200px;align-items:center;height:104px;border-bottom:2px dashed var(--line);font-size:34px}
.row .q{font-family:"Archivo Narrow";color:var(--sub);font-size:26px}.row .u{color:var(--sub);font-size:26px;text-align:right}.row .p{text-align:right}
.row.sel{background:linear-gradient(90deg,rgba(34,197,94,.14),transparent);}
.keys{margin-top:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.key{height:84px;border:2px solid var(--line);display:grid;place-items:center;font-size:24px}
.side{border-left:2px solid var(--line);padding:40px;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(243,243,243,.04),rgba(243,243,243,.01))}
.side .l{font-size:22px;color:var(--sub)}
.tot{font-size:104px;font-weight:600;letter-spacing:-.03em;line-height:1;margin-top:16px}
.tot small{font-size:40px;color:var(--sub);font-weight:500;margin-right:14px}
.sum{margin-top:30px;display:flex;flex-direction:column;gap:12px;font-size:26px;color:var(--sub)}.sum div{display:flex;justify-content:space-between}
.pay{margin-top:auto;display:grid;gap:16px}
.btn{height:104px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:30px;border:2px solid var(--line)}
.btn.go{background:var(--green);color:var(--night);border-color:var(--green);font-weight:600}
#cu{width:1280px;height:800px;display:grid;grid-template-columns:1fr 1fr;background:radial-gradient(ellipse 70% 60% at 20% 110%,rgba(34,197,94,.3),transparent 70%),var(--night)}
.cl{padding:64px;display:flex;flex-direction:column}
.cl svg{height:44px;width:auto}
.big{font-size:118px;font-weight:600;letter-spacing:-.03em;line-height:1;margin-top:auto}
.big small{display:block;font-size:30px;color:var(--sub);font-weight:500;margin-bottom:18px;letter-spacing:0}
.cr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;border-left:2px solid var(--line)}
.qr{width:360px;height:360px;background:#f3f3f3;padding:22px;display:grid;grid-template-columns:repeat(25,1fr)}
.qr i{display:block}
</style></head><body>
<div id="root"></div>
<script>
const LS='<svg viewBox="0 0 640 552" class="ls"><path d="M320 0 L365.5 78.9 L140.8 468 L288.8 468 L241.5 550 L2.4 550 Z"/><path d="M393.3 127.8 L439.4 207.7 L363.9 338 L515.2 338 L637.6 550 L299.5 550 L346.8 468 L498.2 468 L470.5 420 L224.5 420 Z"/></svg>';
const items=[["1","Rice, 5 kg","7,500"],["2","Cooking oil, 3 L","9,000"],["1","Sugar, 2 kg","3,200"],["3","Milk, 1 L","3,000"],["1","Soap, 6 pack","1,600"]];
const screen=new URLSearchParams(location.search).get("screen")||"operator";
const root=document.getElementById("root");
if(screen==="operator"){
 root.innerHTML=`<div id="op"><div class="bar">${LS}<b>Checkout</b><span class="nar" style="color:var(--sub);font-size:20px">Till 02 · Branch 07</span>
 <div class="chip nar"><span>MoMo</span><span>Card</span><span class="ok">EBM ✓ signed</span></div></div>
 <div class="items">${items.map((r,i)=>`<div class="row${i===1?" sel":""}"><span class="q">×${r[0]}</span><span>${r[1]}</span><span class="u">RWF</span><span class="p">${r[2]}</span></div>`).join("")}
 <div class="keys nar">${["Scan","Search","Qty","Discount","Hold","Void"].map(k=>`<div class="key">${k}</div>`).join("")}</div></div>
 <div class="side"><span class="l nar">Total</span><div class="tot"><small>RWF</small>24,300</div>
 <div class="sum"><div><span>Items</span><span>8</span></div><div><span>VAT (incl.)</span><span>3,707</span></div><div><span>Customer</span><span>Walk-in</span></div></div>
 <div class="pay"><div class="btn nar"><span>Cash</span><span>→</span></div><div class="btn nar"><span>Card</span><span>→</span></div><div class="btn go nar"><span>Pay with MoMo</span><span>→</span></div></div></div></div>`;
}else{
 let q="";for(let y=0;y<25;y++)for(let x=0;x<25;x++){const f=(x<7&&y<7)||(x>17&&y<7)||(x<7&&y>17);const edge=f&&(x%6===0||y%6===0||x===24||y===24||(x>1&&x<5&&y>1&&y<5)||(x>19&&x<23&&y>1&&y<5)||(x>1&&x<5&&y>19&&y<23));const on=f?edge:((x*7+y*13+x*y)%5<2);q+=`<i style="background:${on?"#020a07":"transparent"}"></i>`;}
 root.innerHTML=`<div id="cu"><div class="cl">${LS}<div class="big"><small class="nar">Total to pay</small>RWF 24,300</div><span class="nar" style="margin-top:28px;color:var(--sub);font-size:22px">8 items · EBM receipt follows</span></div>
 <div class="cr"><div class="qr">${q}</div><span class="nar" style="font-size:30px;color:var(--green)">Pay with MoMo</span><span style="font-size:24px;color:var(--sub)">Scan, or dial the code on your receipt</span></div></div>`;
}
document.fonts.ready.then(()=>document.body.dataset.ready="1");
</script></body></html>
